services:
  receiver:
    image: ghcr.io/divin/koemichi:latest
    ports:
      - "127.0.0.1:${KOEMICHI_PORT:-8001}:8000"
    environment:
      TRANSCRIPT_INGEST_TOKEN: ${TRANSCRIPT_INGEST_TOKEN:-}
      DATA_DIR: /data
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-normal}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
    restart: unless-stopped

  worker:
    image: ghcr.io/divin/koemichi:latest
    command: ["python", "-m", "koemichi.services.worker"]
    environment:
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      NOTEDISCOVERY_API_URL: ${NOTEDISCOVERY_API_URL:?Set NOTEDISCOVERY_API_URL in .env}
      DATA_DIR: /data
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-normal}
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
