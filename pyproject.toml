[project]
name = "koemichi"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-ai>=2.54.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.47",
    "starlette>=1.7.0",
]


[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
